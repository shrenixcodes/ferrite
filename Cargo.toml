[package]
name = "ferrite"
version = "0.1.0"
edition = "2024"
description = "A fast, lightweight, terminal-native system monitor built in Rust."
license = "MIT"
readme = "README.md"
keywords = ["system-monitor", "terminal", "tui", "cli"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "network", "system"] }
toml = "1.1.8"
