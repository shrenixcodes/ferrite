[package]
name = "ferrite"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, lightweight, terminal-native system monitor built in Rust."
license = "MIT"
readme = "README.md"
repository = "https://github.com/shrenixcodes/ferrite"
keywords = ["system-monitor", "terminal", "tui", "cli"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "network", "system"] }
toml = "1.1.8"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false
